
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050b1d">
<title>INPP MASTER</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --blue: #087bff;
  --gold: #ffd578;
  --dark: #050b1d;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  background:
    radial-gradient(ellipse at 50% 40%, #164b94 0%, #0a1b40 45%, #030713 100%);
}

.app {
  position: relative;
  min-height: 100vh;
  padding: 26px 18px 35px;
  display: flex;
  flex-direction: column;
  align-items: center;
  isolation: isolate;
  overflow: hidden;
}

.app::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 10%,
      #3388ff0a 10.2% 10.4%,
      transparent 10.6% 20%
    ),
    radial-gradient(ellipse at 50% 55%, #1767d044, transparent 55%);
}

.spotlight {
  position: absolute;
  top: -60px;
  width: 130px;
  height: 480px;
  opacity: .32;
  filter: blur(15px);
  transform-origin: top center;
  background: linear-gradient(
    to bottom,
    #ffffff,
    #328bff80 35%,
    transparent 100%
  );
  clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
  pointer-events: none;
}

.light-one {
  left: 6%;
  transform: rotate(-19deg);
}

.light-two {
  right: 6%;
  transform: rotate(19deg);
}

.light-three {
  left: 43%;
  opacity: .18;
  transform: rotate(-5deg);
}

header {
  position: relative;
  z-index: 2;
  width: 100%;
  text-align: center;
}

.kicker {
  font-size: 10px;
  letter-spacing: 4px;
  font-weight: bold;
  color: #f5d68f;
}

.brand {
  margin-top: 13px;
  line-height: .85;
  font-weight: 1000;
  font-size: clamp(45px, 10vw, 88px);
  letter-spacing: -3px;
  color: #fff9e9;
  -webkit-text-stroke: 1px #e6b74f;
  text-shadow:
    0 2px 0 #c99b40,
    0 5px 0 #75501f,
    0 10px 18px #000c,
    0 0 35px #ffc54d55;
}

.brand span {
  display: block;
  margin-top: 8px;
  font-size: .59em;
  letter-spacing: 8px;
  color: var(--gold);
  -webkit-text-stroke: 0;
  text-shadow:
    0 3px 0 #855c21,
    0 0 24px #ffca4f77;
}

.laurels {
  margin-top: 16px;
  color: #eac36c;
  font-size: 18px;
  letter-spacing: 12px;
}

.stage {
  position: relative;
  width: min(100%, 590px);
  margin: 24px auto 0;
  aspect-ratio: 1.25 / 1;
  max-height: 410px;
  display: grid;
  place-items: center;
  border-radius: 50%;
}

.stage-ring {
  position: absolute;
  width: 72%;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 5px solid #f6cf70;
  box-shadow:
    0 0 10px #ffda83,
    0 0 28px #1684ff,
    inset 0 0 28px #1684ff,
    inset 0 0 0 9px #102d5c,
    inset 0 0 0 12px #e9bb5c;
  background:
    repeating-conic-gradient(
      from 0deg,
      #236ec5 0deg 2deg,
      #0b1c3d 3deg 8deg
    );
}

.stage-ring::before {
  content: "";
  position: absolute;
  inset: 12%;
  border: 2px solid #70baff;
  border-radius: 50%;
  box-shadow: 0 0 22px #1684ff;
}

.question {
  position: relative;
  z-index: 1;
  margin-top: -4%;
  font-size: clamp(145px, 38vw, 270px);
  font-weight: 900;
  line-height: 1;
  color: #ffedb5;
  -webkit-text-stroke: 2px #d59b37;
  text-shadow:
    0 4px 0 #926320,
    0 0 12px #ffd775,
    0 0 35px #ffbd42,
    0 15px 25px #000c;
}

.stage-floor {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 22%;
  border-radius: 50%;
  border: 3px solid #e8bd5e;
  transform: perspective(150px) rotateX(22deg);
  box-shadow:
    0 0 12px #ffce68,
    0 0 28px #148bff,
    inset 0 0 22px #166aff;
  background: linear-gradient(#173e79, #030917);
}

.stage-floor::after {
  content: "";
  position: absolute;
  inset: 14%;
  border-radius: 50%;
  border: 2px solid #218aff;
}

.controls {
  position: relative;
  z-index: 3;
  display: grid;
  gap: 15px;
  width: min(100%, 440px);
  margin-top: 10px;
}

.play-button {
  min-height: 67px;
  padding: 13px 18px;
  display: grid;
  grid-template-columns: 38px 1fr 25px;
  align-items: center;
  gap: 8px;
  color: white;
  font-size: clamp(12px, 3.5vw, 17px);
  font-weight: 900;
  letter-spacing: 1px;
  border-radius: 16px;
  border: 2px solid #f5d27c;
  background: linear-gradient(110deg, #09162f, #174b94, #09162f);
  box-shadow:
    0 0 8px #ffd16d,
    0 0 20px #1682ff66,
    inset 0 0 15px #388dff38;
  cursor: pointer;
  transition: transform .15s, filter .15s;
}

.play-button .symbol {
  font-size: 27px;
  color: var(--gold);
}

.play-button .arrow {
  font-size: 28px;
  color: var(--gold);
}

.play-button.multiplayer {
  border-color: #55a7ff;
  box-shadow:
    0 0 9px #1682ff,
    0 0 22px #1682ff66,
    inset 0 0 15px #388dff38;
}

.play-button.multiplayer .symbol,
.play-button.multiplayer .arrow {
  color: #8dc7ff;
}

.play-button:active {
  transform: scale(.98);
  filter: brightness(1.3);
}

#panel {
  display: none;
  position: relative;
  z-index: 4;
  width: min(100%, 440px);
  margin-top: 20px;
  padding: 22px;
  border: 1px solid #e9c56e;
  border-radius: 15px;
  background: #07132af5;
  box-shadow: 0 0 25px #1682ff44;
  text-align: center;
}

#panel h2 {
  color: var(--gold);
  margin-top: 0;
}

#panel p {
  color: #dce7ff;
  line-height: 1.6;
}

.back-button {
  padding: 12px 18px;
  border-radius: 9px;
  border: 1px solid #75aaff;
  background: #142d57;
  color: white;
  font-weight: bold;
}

@media (min-width: 700px) {
  .app {
    padding-top: 35px;
  }

  .stage {
    margin-top: 15px;
  }

  .controls {
    margin-top: 0;
  }
}

@media (max-width: 380px) {
  .app {
    padding-left: 12px;
    padding-right: 12px;
  }

  .kicker {
    letter-spacing: 2px;
  }

  .brand {
    letter-spacing: -2px;
  }

  .brand span {
    letter-spacing: 6px;
  }

  .stage {
    margin-top: 12px;
  }

  .play-button {
    min-height: 60px;
    padding: 10px;
  }
}
</style>
</head>

<body>
<main class="app">
  <div class="spotlight light-one"></div>
  <div class="spotlight light-two"></div>
  <div class="spotlight light-three"></div>

  <header>
    <div class="kicker">LE GRAND JEU DE CULTURE GÉNÉRALE</div>
    <h1 class="brand">
      INPP
      <span>MASTER</span>
    </h1>
    <div class="laurels">✦　❧　✦</div>
  </header>

  <section class="stage" aria-label="Plateau de quiz">
    <div class="stage-ring"></div>
    <div class="question">?</div>
    <div class="stage-floor"></div>
  </section>

  <nav class="controls" aria-label="Modes de jeu">
    <button class="play-button" onclick="showMode('solo')">
      <span class="symbol">♟</span>
      <span>JOUER EN SOLO</span>
      <span class="arrow">›</span>
    </button>

    <button class="play-button multiplayer" onclick="showMode('multi')">
      <span class="symbol">♟♟</span>
      <span>JOUER ENTRE AMIS</span>
      <span class="arrow">›</span>
    </button>
  </nav>

  <section id="panel" aria-live="polite">
    <h2 id="panel-title"></h2>
    <p id="panel-text"></p>
    <button class="back-button" onclick="closePanel()">
      RETOUR À L’ACCUEIL
    </button>
  </section>
</main>

<script>
function showMode(mode) {
  const panel = document.getElementById("panel");
  const title = document.getElementById("panel-title");
  const text = document.getElementById("panel-text");

  if (mode === "solo") {
    title.textContent = "MODE SOLO";
    text.textContent =
      "Le défi individuel arrive bientôt. La prochaine étape sera de connecter les catégories et les questions Supabase.";
  } else {
    title.textContent = "MODE MULTIJOUEUR";
    text.textContent =
      "Le défi entre amis arrive bientôt. Nous ajouterons les salons, les codes d’invitation et le classement.";
  }

  panel.style.display = "block";
  panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function closePanel() {
  document.getElementById("panel").style.display = "none";
}
</script>
</body>
</html>
